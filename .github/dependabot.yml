# Atualizações automáticas de dependências (complementa o job de SCA do CI).
# Abre PRs semanais com bumps de versão — mantém requests/urllib3, pacotes npm
# e as próprias GitHub Actions atualizados, reduzindo o skew de versões que
# aparece como aviso no CI (ex.: RequestsDependencyWarning do urllib3).
version: 2
updates:
  # Backend Python (pip)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Agrupa dev-deps num PR só (lint/test), separado das deps de runtime.
      dev-dependencies:
        patterns:
          - pytest*
          - ruff
          - black
          - factory-boy
          - "*-cov"
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps)

  # Frontend (npm)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bumps de patch/minor num PR só — reduz ruído; majors vêm separados.
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps)

  # GitHub Actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
