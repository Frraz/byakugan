name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancela execuções obsoletas da mesma branch/PR quando novos commits chegam
# — evita gastar minutos de CI rodando um estado já superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nenhum job precisa de mais que leitura do repositório (sem publicar
# pacotes, comentar PRs ou editar releases) — least privilege por padrão.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: byakugan
          POSTGRES_USER: byakugan
          POSTGRES_PASSWORD: byakugan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U byakugan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # CELERY_BROKER_URL/RESULT_BACKEND (abaixo) apontam pra cá. Os testes
      # de API mockam run_scan.delay (nunca publicam de verdade), mas sem
      # este serviço qualquer .delay() esquecido sem mock trava a task
      # tentando conectar em vez de falhar rápido e claro.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      POSTGRES_DB: byakugan
      POSTGRES_USER: byakugan
      POSTGRES_PASSWORD: byakugan
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      BYAKUGAN_SCANNING_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check apps config
      - name: Format check (black)
        run: black --check apps config
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (pytest + coverage)
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (typecheck + vite)
        run: npm run build
      - name: Tests (vitest)
        run: npm test

  sca:
    name: Dependency audit (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high || true
