# Config de referência para o nginx do HOST (não roda dentro de Docker).
#
# Padrão do servidor Ferzion: o nginx do host é o ÚNICO dono das portas 80/443
# e faz proxy para a porta loopback do container (aqui, 127.0.0.1:8012).
#
# Instalar no servidor:
#   sudo cp deploy/nginx/byakugan.ferzion.com.br.conf \
#     /etc/nginx/sites-available/byakugan.ferzion.com.br
#   sudo ln -s /etc/nginx/sites-available/byakugan.ferzion.com.br \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois emitir o certificado (o certbot edita este arquivo e adiciona o bloco
# HTTPS/443 + redirect — NÃO adicione SSL manualmente antes):
#   sudo certbot --nginx -d byakugan.ferzion.com.br

server {
    listen 80;
    listen [::]:80;
    server_name byakugan.ferzion.com.br;

    client_max_body_size 20M;

    # SPA React (build do Vite). Servido diretamente pelo nginx do host.
    root /var/www/docker-instances/Byakugan/frontend/dist;
    index index.html;

    # Estáticos do Django admin/DRF (servidos pelo whitenoise via gunicorn).
    location /static/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    # API e painel admin → backend Django (gunicorn na porta loopback).
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Demais rotas → SPA (fallback para index.html no client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
