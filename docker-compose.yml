# Rede: propositalmente SEM bloco `networks:` custom — um subnet IPv4
# "chutado" nesse bloco (mesma ideia, no compose de produção) colidiu com
# outra rede Docker já alocada num host que roda vários projetos
# ("Pool overlaps with other one on this address space", 13/08/2026). Sem
# esse bloco, o Compose usa a rede bridge padrão com subnet auto-alocado
# pelo Docker (sem colisão manual). Efeito colateral: sem saída IPv6 real
# pro `celery` varrer alvos IPv6. Pra reativar com segurança, rode
# `docker network ls` + `docker network inspect <cada rede> --format
# '{{.Name}}: {{range .IPAM.Config}}{{.Subnet}} {{end}}'` na máquina alvo
# primeiro, pra achar um bloco livre de verdade em vez de adivinhar. Ver
# docs/scanning-engine.md → Suporte IPv4/IPv6.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-byakugan}
      POSTGRES_USER: ${POSTGRES_USER:-byakugan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byakugan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-byakugan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    # Bypassa o entrypoint (migrate é responsabilidade do backend/web).
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
