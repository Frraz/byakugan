# Rede dual-stack: os adapters do motor de scan (celery/backend) precisam de
# saída IPv6 real pra varrer alvos IPv6 — a rede bridge padrão do Compose é
# IPv4-only. Exige Docker Engine com suporte a NAT66 (>=27); confirme com
# `docker compose exec celery python -c "import socket;
# print(socket.getaddrinfo('ipv6.google.com', 443))"` antes de confiar nisso
# em produção. Ver docs/scanning-engine.md.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:dead:beef::/48

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-byakugan}
      POSTGRES_USER: ${POSTGRES_USER:-byakugan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byakugan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-byakugan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    # Bypassa o entrypoint (migrate é responsabilidade do backend/web).
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
