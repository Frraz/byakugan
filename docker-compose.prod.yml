# Byakugan — produção (servidor Ferzion).
#
# Convenções do servidor (ver /var/www/docker-instances/README.md):
#  - NENHUM container mapeia as portas 80/443 (só o nginx do HOST é dono delas).
#  - O web publica APENAS em 127.0.0.1:<porta> (loopback); o nginx do host faz proxy.
#  - Banco e Redis ficam só na rede interna do compose (sem portas no host).
#  - container_name prefixado com "byakugan_" para não colidir com outros sistemas.
#
# Porta loopback deste projeto: 8012  (confirme livre: ss -tlnp | grep 8012)
#
# Rede dual-stack: o `celery` precisa de saída IPv6 real pra varrer alvos
# IPv6 — a rede bridge padrão do Compose é IPv4-only. Exige, no HOST:
#  1. Docker Engine >=27 com `"ip6tables": true` em /etc/docker/daemon.json
#     (reinicie o daemon: sudo systemctl restart docker) — sem isso o
#     container recebe endereço IPv6 mas não tem NAT pra sair à internet.
#  2. O próprio servidor ter conectividade IPv6 de saída (nem todo VPS tem —
#     confirme com `curl -6 https://ifconfig.co` no HOST antes de assumir
#     que vai funcionar dentro do container).
# Ver docs/scanning-engine.md e DEPLOY.md.

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.0.0/16
        - subnet: fd00:cafe:babe::/48

services:
  db:
    image: postgres:16-alpine
    container_name: byakugan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-byakugan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byakugan}
      POSTGRES_DB: ${POSTGRES_DB:-byakugan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-byakugan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: byakugan_redis
    restart: unless-stopped
    # Sem portas publicadas — acessível apenas na rede interna do compose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./backend
    container_name: byakugan_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      # Persiste os relatórios gerados (PDF/CSV/JSON) entre redeploys. Geração
      # e download são síncronos dentro do próprio web — celery não acessa.
      - report_media:/app/media
    ports:
      # Loopback apenas — o nginx do host faz proxy para cá.
      - "127.0.0.1:8012:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # X-Forwarded-Proto:https evita o redirect HTTP->HTTPS do SECURE_SSL_REDIRECT
      # (o healthcheck fala direto com o gunicorn, sem passar pelo nginx do host).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/api/health/', headers={'X-Forwarded-Proto': 'https'}))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery:
    build:
      context: ./backend
    container_name: byakugan_celery
    restart: unless-stopped
    # Bypassa o entrypoint (migrate/collectstatic é responsabilidade só do web).
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  postgres_data:
  report_media:
